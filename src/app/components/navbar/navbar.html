<header class="nav-wrap" [class.is-compact]="compact() || !onHome">
  <div class="navbar">
    <a class="brand" routerLink="/" (click)="close()" aria-label="Megyeri Márk – főoldal">
      <strong>MEGYERI <span>MÁRK</span></strong>
    </a>
    <nav id="site-navigation" class="nav-links" [class.open]="menuOpen()" aria-label="Fő navigáció">
      @for (item of items; track item.label) {
        <a [routerLink]="item.link" [fragment]="item.fragment" [class.is-active]="isActive(item)" [class.only-mobile]="item.mobileOnly"
           [attr.aria-current]="isActive(item) ? 'page' : null" (click)="close()">{{ item.label }}</a>
      }
      <a class="mobile-quote" routerLink="/ajanlatkeres" (click)="close()">Kérj ajánlatot <span aria-hidden="true">→</span></a>
    </nav>
    <div class="nav-actions">
      <button type="button" class="theme-btn" (click)="toggleTheme()"
        [attr.aria-label]="isDark() ? 'Világos téma' : 'Sötét téma'" [title]="isDark() ? 'Világos téma' : 'Sötét téma'">
        <span aria-hidden="true">{{ isDark() ? '☼' : '☾' }}</span>
      </button>
      <a class="nav-cta" routerLink="/ajanlatkeres" (click)="close()">Kérj ajánlatot <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15M13 6l6 6-6 6"/></svg></a>
      <button class="menu-btn" aria-controls="site-navigation" type="button" (click)="toggleMenu()"
        [attr.aria-expanded]="menuOpen()" [attr.aria-label]="menuOpen() ? 'Menü bezárása' : 'Menü megnyitása'">
        {{ menuOpen() ? '✕' : '☰' }}
      </button>
    </div>
  </div>
  <div class="scroll-progress" aria-hidden="true"><i [style.transform]="'scaleX(' + scrollProgress() + ')'"></i></div>
</header>
