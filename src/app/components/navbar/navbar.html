<header class="nav-wrap" [class.is-compact]="compact() || !onHome">
  <div class="navbar">
    <a class="brand" [routerLink]="'/' | lp" (click)="close()" [attr.aria-label]="'Megyeri Márk – főoldal' | t">
      <app-brand-mark class="brand-mark" />
      <strong>{{ 'MEGYERI' | t }} <span>{{ 'MÁRK' | t }}</span> {{ 'MÁTÉ' | t }} </strong>
    </a>
    <nav id="site-navigation" class="nav-links" [class.open]="menuOpen()" [attr.aria-label]="'Fő navigáció' | t">
      @for (item of items; track item.label) {
        <a [routerLink]="item.link | lp" [fragment]="item.fragment" [class.is-active]="isActive(item)" [class.only-mobile]="item.mobileOnly"
      [attr.aria-current]="isActive(item) ? 'page' : null" (click)="close()">{{ item.label | t }}</a>
      }
      <a class="mobile-quote" [routerLink]="'/ajanlatkeres' | lp" (click)="close()">{{ 'Kérj ajánlatot' | t }} <span aria-hidden="true">→</span></a>
    </nav>
    <div class="nav-actions">
      <button type="button" class="theme-btn" (click)="toggleTheme()" [attr.aria-pressed]="!isDark()"
        [attr.aria-label]="(isDark() ? 'Világos téma' : 'Sötét téma') | t" [title]="(isDark() ? 'Világos téma' : 'Sötét téma') | t">
        @if (isDark()) {<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>}
        @else {<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.2 14.6A8.4 8.4 0 0 1 9.4 3.8a8.4 8.4 0 1 0 10.8 10.8z"/></svg>}
      </button>
      <button type="button" class="lang-btn" (click)="i18n.toggle()" [attr.aria-label]="i18n.lang() === 'hu' ? 'Switch to English' : 'Váltás magyar nyelvre'" [attr.lang]="i18n.lang() === 'hu' ? 'en' : 'hu'">{{ i18n.lang() === 'hu' ? 'EN' : 'HU' }}</button>
      <a class="nav-cta" [routerLink]="'/ajanlatkeres' | lp" (click)="close()">{{ 'Kérj ajánlatot' | t }} <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15M13 6l6 6-6 6"/></svg></a>
      <button class="menu-btn" aria-controls="site-navigation" type="button" (click)="toggleMenu()"
        [attr.aria-expanded]="menuOpen()" [attr.aria-label]="(menuOpen() ? 'Menü bezárása' : 'Menü megnyitása') | t">
        {{ menuOpen() ? '✕' : '☰' }}
      </button>
    </div>
  </div>
  <div class="scroll-progress" aria-hidden="true"><i [style.transform]="'scaleX(' + scrollProgress() + ')'"></i></div>
</header>
