<a class="skip-link" href="#" (click)="skipToMain($event)">{{ 'Ugrás a tartalomra' | t }}</a>
@if (showNavbar() && showPromoBar()) {
<app-promo-bar></app-promo-bar>
}
@if (showNavbar()) {
<app-navbar></app-navbar>
}
<router-outlet></router-outlet>
@if (showTop() && showNavbar()) {
<button type="button" class="to-top" (click)="scrollTop()" [attr.aria-label]="'Vissza az oldal tetejére' | t">↑</button>
}
@if (showMobileCta() && showNavbar()) {
<div class="mobile-cta" role="region" [attr.aria-label]="'Gyors kapcsolatfelvétel' | t">
  <a class="mobile-cta__main" routerLink="/ajanlatkeres">{{ 'Ajánlatot kérek' | t }} <span aria-hidden="true">→</span></a>
  @if (phone()) {
  <a class="mobile-cta__call" [href]="'tel:' + phone()" [attr.aria-label]="'Hívás' | t">{{ 'Hívás' | t }}</a>
  }
</div>
}

<app-toast-host></app-toast-host>
<app-submit-loader />
@if (showNavbar()) {<app-cookie-banner></app-cookie-banner><app-seasonal-decor />}
