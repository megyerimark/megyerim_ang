name: CI

on:
  push:
  pull_request:
  schedule:
    # Hetente sérülékenység-ellenőrzés akkor is, ha nem változott a kód.
    - cron: '0 6 * * 1'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Sérülékeny függőségek keresése (éles csomagok)
        run: npm audit --omit=dev --audit-level=high
      - name: Éles build (szigorú sablon-típusellenőrzéssel)
        run: npx ng build --configuration production
